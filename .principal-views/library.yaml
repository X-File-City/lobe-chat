  api-call:
    description: "API request/response flow"
    color: "#ff8c00"
    tags: ["communication", "api", "request"]
    width: 2
    directed: true

  state-sync:
    description: "State synchronization between components"
    color: "#107c10"
    tags: ["data", "state", "sync"]
    width: 2
    directed: true

  # Integration Patterns
  plugin-connection:
    description: "Plugin system connections"
    color: "#8064a2"
    tags: ["integration", "plugin", "connection"]
    width: 2
    directed: true

  tool-execution:
    description: "Tool calling and execution flow"
    color: "#d83b01"
    tags: ["workflow", "tool", "execution"]
    width: 2
    directed: true

  # User Interactions
  user-input:
    description: "User input to system"
    color: "#5c2d91"
    tags: ["interaction", "input", "user"]
    width: 2
    directed: true

  ai-response:
    description: "AI response to user"
    color: "#5c2d91"
    tags: ["interaction", "response", "ai"]
    width: 2
    directed: true

  # System Operations
  authentication:
    description: "User authentication flow"
    color: "#a4262c"
    tags: ["security", "auth", "flow"]
    width: 2
    directed: true

  data-persistence:
    description: "Data storage and retrieval"
    color: "#107c10"
    tags: ["data", "storage", "persistence"]
    width: 2
    directed: true

  real-time-sync:
    description: "Real-time data synchronization"
    color: "#ff8c00"
    tags: ["communication", "realtime", "sync"]
    width: 2
    directed: true

  # Dependencies
  depends-on:
    description: "Component dependency relationship"
    color: "#616161"
    tags: ["dependency", "relationship", "system"]
